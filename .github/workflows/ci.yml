name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run notices --check
      - run: bun test
        env:
          EXPECT_LUA_VERSION: "5.4"

  # The shared Lua protocol core also has to run under Lua 5.3, which BizHawk on some Linux distros loads.
  bridge-lua-5-3:
    name: Bridge protocol (Lua 5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.3"
      - run: bun install --frozen-lockfile
      - run: bun test server/test/bridge
        env:
          EXPECT_LUA_VERSION: "5.3"

  # Builds api/ to dist, packs it, and lints the tarball. publint and attw are pinned in the root package.json.
  api-package:
    name: API package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - working-directory: api
        run: |
          bun run build
          bun pm pack --destination ../pack
      - run: |
          bunx publint pack/*.tgz
          bunx attw pack/*.tgz --profile esm-only
      - run: bun scripts/api-consumer-smoke.ts pack/*.tgz

  compile-smoke:
    name: Compile smoke (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: test ! -e api/dist
      - run: >-
          bun build --compile --target=bun-linux-x64-baseline
          --define 'PMR_TARGET="linux-x64-baseline"'
          --define "PMR_COMMIT=\"${GITHUB_SHA::7}\""
          --outfile out/pokemon-memory-reader server/src/main.ts
      - run: bun scripts/smoke.ts out/pokemon-memory-reader "$(jq -r .version server/package.json)"

  rehost-smoke:
    name: Re-host smoke (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Compiles onto a copy of the official bun kept apart from the one running the build. This shows the app can be
      # re-hosted onto a given bun, not that relinking works (docs/lgpl-relinking.md, amendment 042 §7).
      - run: |
          mkdir -p "$RUNNER_TEMP/rehost"
          cp "$(command -v bun)" "$RUNNER_TEMP/rehost/bun"
          bun build --compile --compile-executable-path "$RUNNER_TEMP/rehost/bun" \
            --define 'PMR_TARGET="linux-x64"' \
            --define "PMR_COMMIT=\"${GITHUB_SHA::7}\"" \
            --outfile out/pokemon-memory-reader-rehost server/src/main.ts
      - run: bun scripts/smoke.ts out/pokemon-memory-reader-rehost "$(jq -r .version server/package.json)"
